; PHP settings for FastCGI / PHP-FPM, where .htaccess php_value is not allowed.
; Same limits as the mod_php block in .htaccess. PHP re-reads this file about
; every 5 minutes (user_ini.cache_ttl), so a change is not instant.
upload_max_filesize = 5M
post_max_size = 6M
max_execution_time = 60
memory_limit = 256M
